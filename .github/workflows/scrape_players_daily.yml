name: Scraping Jugadors i Plantilles FFCV (Dilluns a Divendres)

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 04:00 UTC (06:00 hora peninsular española)
    - cron: '0 4 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub con un clic

# Permisos para que github-actions[bot] pueda hacer commit y push de los datos
permissions:
  contents: write

jobs:
  scrape-and-sync-players:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependencias del proyecto
        run: npm ci || npm install

      - name: 🌐 Instalar navegador Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: 👥 Ejecutar Scraping FFCV (Plantillas por rotación diaria)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape_ffcv_infantil.cjs --players-only --rotation --teams-per-run 25

      - name: 💾 Guardar datos JSON y fotos en el repositorio (Commit & Push)
        # always(): las fotos y los JSON se suben aunque el scraping falle o se agote el tiempo,
        # porque Supabase ya puede apuntar a las fotos nuevas de public/players
        if: ${{ always() }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/scraped_teams.json src/data/scraped_players.json src/data/scrape_rotation.json public/players || true
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en los datos locales."
            exit 0
          fi
          git commit -m "chore(data): actualización automática de plantillas y jugadores"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "Push rechazado (intento $attempt), reintentando..."
            sleep 10
          done
          exit 1
