name: Scraping Semanal FFCV (Jueves)

on:
  schedule:
    # Se ejecuta todos los jueves a las 05:00 UTC (07:00 hora peninsular española)
    - cron: '0 5 * * 4'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub con un clic

# Permisos para que github-actions[bot] pueda hacer commit y push de los datos
permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependencias del proyecto
        run: npm ci || npm install

      - name: 🌐 Instalar navegador Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: ⚽ Ejecutar Scraping FFCV (Partidos y Campos)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape_ffcv_infantil.cjs --matches-only

      - name: 💾 Guardar datos JSON en el repositorio (Commit & Push)
        # always(): los JSON se suben aunque el scraping falle o se agote el tiempo
        if: ${{ always() }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/scraped_matches.json scripts/fields_cache.json || true
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en los datos locales."
            exit 0
          fi
          git commit -m "chore(data): actualización automática de partidos y campos"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "Push rechazado (intento $attempt), reintentando..."
            sleep 10
          done
          exit 1
